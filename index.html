<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Universal Proxy Converter v3.9</title>
  <!-- QRCode.js CDN for client-side QR generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --primary: #0ea5e9; --primary-hover: #0284c7;
      --text: #e2e8f0; --muted: #94a3b8;
      --success: #4ade80; --error: #f87171; --warn: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 20px; }
    .container { max-width: 1450px; margin: 0 auto; }
    h1 { text-align: center; color: var(--primary); margin-bottom: 4px; font-size: 25px; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 20px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    textarea, input, select {
      width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 9px 11px; font-family: ui-monospace, monospace; font-size: 12.5px;
    }
    textarea { min-height: 115px; resize: vertical; }
    .row { display: flex; gap: 10px; margin-bottom: 9px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 100px; }
    .checkbox { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
    .checkbox input { width: auto; }
    button { background: var(--primary); color: white; border: none; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button.success-btn { background: #16a34a; }
    .btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
    .tab { padding: 6px 14px; background: #334155; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
    .tab.active { background: var(--primary); }
    .status { margin-top: 10px; font-size: 12.5px; min-height: 18px; }
    .success { color: var(--success); } .error { color: var(--error); } .warn { color: var(--warn); }
    .section-title { font-size: 13px; font-weight: 600; color: var(--primary); margin: 14px 0 8px 0; padding-bottom: 3px; border-bottom: 1px solid var(--border); }
    .mode-switch { display: flex; gap: 8px; margin-bottom: 12px; }
    .mode-btn { flex: 1; text-align: center; padding: 7px; background: #334155; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
    .mode-btn.active { background: var(--primary); }
    .hidden { display: none; }
    .action-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .config-item { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 7px; overflow: hidden; }
    .config-summary { display: flex; justify-content: space-between; align-items: center; padding: 9px 11px; cursor: pointer; }
    .config-summary:hover { background: #162032; }
    .config-info { display: flex; align-items: center; gap: 7px; flex: 1; overflow: hidden; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    .badge-vless { background: #0284c7; color: white; }
    .badge-vmess { background: #d97706; color: white; }
    .badge-trojan { background: #7c3aed; color: white; }
    .badge-wireguard { background: #059669; color: white; }
    .config-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .config-details { padding: 9px 11px; border-top: 1px solid var(--border); background: #0a0f1d; display: none; }
    .config-details.open { display: block; }
    .item-output { min-height: 110px; font-size: 11px; margin-top: 5px; }
    .fetch-log { font-size: 11px; color: var(--muted); margin-top: 5px; max-height: 80px; overflow-y: auto; }
    
    /* QR Code Container Styles */
    .qr-wrapper { margin-top: 12px; text-align: center; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: none; }
    .qr-wrapper.active { display: block; }
    .qr-box { display: inline-block; background: #ffffff; padding: 10px; border-radius: 8px; margin-top: 6px; }
    .qr-box canvas, .qr-box img { display: block; margin: 0 auto; }
    .qr-error { color: var(--error); font-size: 12px; margin-top: 6px; font-weight: 500; }
    .note { font-size: 11px; color: var(--muted); margin-top: 4px; }

</head>
<body>
  <div class="container">

<script>
let currentTab = 'amnezia';
let currentMode = 'paste';
let parsedProxiesGlobal = [];
let allExpanded = false;
const $ = id => document.getElementById(id);

function syncReservedToAmnezia() {
  const raw = $('manualReserved').value.trim().replace(/[\[\]]/g, '');
  const parts = raw.split(',').map(s => parseInt(s.trim(), 10) || 0);
  $('s1').value = parts[0] || 0;
  $('s2').value = parts[1] || 0;
  $('s3').value = parts[2] || 0;
}

function parseEndpoint(endpoint) {
  if (!endpoint) return { host: '', port: 51820 };
  endpoint = endpoint.trim();
  const ipv6Match = endpoint.match(/^\[([^\]]+)\](?::(\d+))?$/);
  if (ipv6Match) return { host: ipv6Match[1], port: parseInt(ipv6Match[2] || '51820', 10) };
  const lastColon = endpoint.lastIndexOf(':');
  if (lastColon > 0) {
    const possiblePort = endpoint.slice(lastColon + 1);
    if (/^\d+$/.test(possiblePort)) return { host: endpoint.slice(0, lastColon), port: parseInt(possiblePort, 10) };
  }
  return { host: endpoint, port: 51820 };
}

function parseReserved(val) {
  if (!val) return [0, 0, 0];
  if (Array.isArray(val)) return val.slice(0, 3).map(n => parseInt(n) || 0);
  const clean = String(val).replace(/[\[\]]/g, '');
  const parts = clean.split(',').map(s => parseInt(s.trim(), 10) || 0);
  while (parts.length < 3) parts.push(0);
  return parts.slice(0, 3);
}

function decodeBase64Safe(str) {
  try {
    let clean = str.replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/');
    if (clean.length < 8) return str;
    while (clean.length % 4 !== 0) clean += '=';
    const decoded = atob(clean);
    if (decoded.includes('://') || decoded.trim().startsWith('{') || decoded.trim().startsWith('[')) return decoded;
  } catch (e) {}
  return str;
}

function escapeHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setMode(m) {
  currentMode = m;
  $('modePaste').classList.toggle('active', m === 'paste');
  $('modeManual').classList.toggle('active', m === 'manual');
  $('pasteMode').classList.toggle('hidden', m !== 'paste');
  $('manualMode').classList.toggle('hidden', m !== 'manual');
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  buildCombinedExport();
}

    $('h1').value = 1; $('h2').value = 2; $('h3').value = 3; $('h4').value = 4;

function randomizeAmnezia() {
  $('awgPreset').value = 'custom';
  const jmin = Math.floor(Math.random() * 40) + 20;
  const jmax = jmin + Math.floor(Math.random() * 60) + 20;
  $('jc').value = Math.floor(Math.random() * 8) + 3;
  $('jmin').value = jmin;
  $('jmax').value = jmax;
  $('s1').value = Math.floor(Math.random() * 50) + 15;
  $('s2').value = Math.floor(Math.random() * 50) + 15;
  $('s3').value = 0; $('s4').value = 0;
  $('i1').value = ''; $('i2').value = '';
  const values = new Set();
  while (values.size < 4) values.add(Math.floor(Math.random() * 2147483647) + 1);
  const arr = [...values];
  $('h1').value = arr[0]; $('h2').value = arr[1]; $('h3').value = arr[2]; $('h4').value = arr[3];
}

// ===================== PARSERS =====================
function parseUri(uri) {
  try {
    const u = new URL(uri);
    const protocol = u.protocol.replace(':', '').toLowerCase();
    if (!['vless', 'vmess', 'trojan'].includes(protocol)) return null;

    const params = new URLSearchParams(u.search);
    const hashName = decodeURIComponent(u.hash.replace(/^#/, '')).trim();

    if (protocol === 'vmess') {
      try {
        const b64 = uri.replace('vmess://', '');
        const json = JSON.parse(decodeBase64Safe(b64));
        return {
          protocol: 'vmess',
          name: json.ps || 'VMess Proxy',
          uuid: json.id, host: json.add, port: parseInt(json.port) || 443,
          net: json.net || 'tcp', path: json.path || '/', type: json.type || 'none',
          tls: json.tls || '', sni: json.sni || json.host || '', alpn: json.alpn || '',
          security: json.scy || 'auto', rawUri: uri
        };
      } catch (e) {}
    }

    return {
      protocol,
      name: hashName || `${protocol.toUpperCase()}-Proxy`,
      uuid: decodeURIComponent(u.username),
      password: decodeURIComponent(u.username),
      host: u.hostname,
      port: parseInt(u.port, 10) || (params.get('security') === 'tls' ? 443 : 80),
      type: params.get('type') || 'tcp',
      security: params.get('security') || 'none',
      pbk: params.get('pbk') || '',
      sid: params.get('sid') || '',
      fp: params.get('fp') || 'chrome',
      sni: params.get('sni') || '',
      flow: params.get('flow') || '',
      path: params.get('path') || '/',
      hostHeader: params.get('host') || '',
      rawUri: uri
    };
  } catch (e) {
    return null;
  }
}

function parseWireGuard(text) {
  const r = {
    privateKey: '', addresses: [], publicKey: '', endpoint: '', presharedKey: '', keepalive: 25, allowedIPs: [],
    reserved: [0, 0, 0], awgParams: null
  };
  let section = '';
  const awgExt = {};
  for (const raw of text.split(/\r?\n/)) {
    let line = raw.trim();
    if (!line || line.startsWith('#') || line.startsWith(';')) continue;
    if (line.startsWith('[') && line.endsWith(']')) { section = line.toLowerCase(); continue; }
    const eq = line.indexOf('=');
    if (eq === -1) continue;
    const k = line.slice(0, eq).trim();
    const kl = k.toLowerCase();
    const v = line.slice(eq + 1).trim();

    if (section.includes('interface')) {
      if (kl === 'privatekey') r.privateKey = v;
      else if (kl === 'address') r.addresses = v.split(',').map(s => s.trim());
      else if (kl === 'reserved') r.reserved = parseReserved(v);
      else if (['jc', 'jmin', 'jmax', 's1', 's2', 's3', 's4', 'h1', 'h2', 'h3', 'h4', 'i1', 'i2'].includes(kl)) {
        awgExt[kl] = ['i1', 'i2'].includes(kl) ? v : parseInt(v, 10);
      }
    }
    if (section.includes('peer')) {
      if (kl === 'publickey') r.publicKey = v;
      else if (kl === 'endpoint') r.endpoint = v;
      else if (kl === 'presharedkey') r.presharedKey = v;
      else if (kl === 'persistentkeepalive') r.keepalive = parseInt(v) || 25;
      else if (kl === 'allowedips') r.allowedIPs = v.split(',').map(s => s.trim());
    }
  }
  if (Object.keys(awgExt).length > 0) r.awgParams = awgExt;
  return r;
}

async function fetchSubscription() {
  const url = $('inputData').value.trim();
  const log = $('fetchLog');
  log.innerText = '';
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    log.innerText = '❌ Please enter a valid http/https subscription URL.';
    return;
  }
  log.innerText = '⏳ Fetching subscription...';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    $('inputData').value = decodeBase64Safe(text);
    log.innerText = '✅ Subscription loaded successfully! Click Parse / Refresh.';
  } catch (e) {
    log.innerText = `❌ Error fetching: ${e.message}. (CORS restrictions may apply).`;
  }
}

function defaultSettings() {
  return {
    dns: $('dns').value.trim() || '1.1.1.1',
    mtu: parseInt($('mtu').value) || 1280,
    keepalive: parseInt($('globalKeepalive').value) || 25,
    irBypass: $('irBypass').checked,
    useNoise: $('useNoise').checked,
    useFragment: $('useFragment').checked,
    awg: {
      jc: +$('jc').value, jmin: +$('jmin').value, jmax: +$('jmax').value,
      s1: +$('s1').value, s2: +$('s2').value, s3: +$('s3').value, s4: +$('s4').value,
      h1: +$('h1').value, h2: +$('h2').value, h3: +$('h3').value, h4: +$('h4').value,
      i1: $('i1').value.trim(), i2:$('i2').value.trim()
    }
  };
}

// ===================== EXPORTERS =====================
function buildAmneziaWG(p, s) {
  const awg = s.awg || { jc: 5, jmin: 50, jmax: 100, s1: 0, s2: 0, s3: 0, s4: 0, h1: 1, h2: 2, h3: 3, h4: 4, i1: '', i2: '' };
  let res = `[Interface]
PrivateKey = ${p.privateKey}
Address = ${p.addresses.join(', ')}
DNS = ${s.dns}
MTU = ${s.mtu}
Jc = ${awg.jc}
Jmin = ${awg.jmin}
Jmax = ${awg.jmax}
S1 = ${awg.s1}
S2 = ${awg.s2}
S3 = ${awg.s3 || 0}
S4 = ${awg.s4 || 0}
H1 = ${awg.h1}
H2 = ${awg.h2}
H3 = ${awg.h3}
H4 = ${awg.h4}
`;
  if (awg.i1) res += `I1 = ${awg.i1}\n`;
  if (awg.i2) res += `I2 = ${awg.i2}\n`;

  res += `
[Peer]
PublicKey = ${p.publicKey}
AllowedIPs = ${p.allowedIPs?.length ? p.allowedIPs.join(', ') : '0.0.0.0/0, ::/0'}
Endpoint = ${p.endpoint}
PersistentKeepalive = ${p.keepalive || s.keepalive || 25}${p.presharedKey ? `\nPresharedKey = ${p.presharedKey}` : ''}`;
  return res;
}

function buildClashConfig(entries) {
  const firstName = entries[0]?.p?.name || 'Config-1';
  const dnsHost = entries[0]?.s?.dns || '1.1.1.1';
  const mtuVal = entries[0]?.s?.mtu || 1280;
  const irBypass = entries[0]?.s?.irBypass ?? true;

  let yaml = `mixed-port: 7890
ipv6: true
allow-lan: true
unified-delay: false
log-level: warning
mode: rule

dns:
  enable: true
  respect-rules: true
  use-system-hosts: false
  ipv6: false
  enhanced-mode: redir-host
  nameserver:
    - 10.2.0.1#${firstName}
    - ${dnsHost}#${firstName}
  proxy-server-nameserver:
    - 8.8.8.8#DIRECT
  direct-nameserver:
    - 8.8.8.8#DIRECT

tun:
  enable: true
  stack: mixed
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  mtu: ${mtuVal}

proxies:
`;

  entries.forEach(({ p, s }) => {
    const name = String(p.name).replace(/"/g, '\\"');
    if (p.protocol === 'wireguard') {
      const ep = parseEndpoint(p.endpoint);
      const ip = (p.addresses?.[0] || '172.16.0.2/32');

      yaml += `  - name: "${name}"
    type: wireguard
    server: ${ep.host}
    port: ${ep.port}
    private-key: ${p.privateKey}
    public-key: ${p.publicKey}
    ip: ${ip.includes('/') ? ip : ip + '/32'}
    ip-version: ipv4
    mtu: ${s.mtu}
    udp: true
    persistent-keepalive: ${p.keepalive || s.keepalive || 25}
    allowed-ips:
      - 0.0.0.0/0
      - ::/0
`;
    } else {
      yaml += `  - name: "${name}"
    type: ${p.protocol}
    server: ${p.host}
    port: ${p.port}
    uuid: ${p.uuid || p.password}
    udp: true
`;
      if (p.security === 'tls' || p.security === 'reality') yaml += `    tls: true\n    servername: ${p.sni || p.host}\n`;
    }
  });

  yaml += `\nproxy-groups:\n  - name: "✅ Selector"\n    type: select\n    proxies:\n`;
  entries.forEach(({ p }) => { yaml += `      - "${String(p.name).replace(/"/g, '\\"')}"\n`; });
  yaml += `      - DIRECT\n\nrules:\n`;
  yaml += `  - GEOIP,lan,DIRECT,no-resolve\n`;
  yaml += `  - GEOIP,private,DIRECT,no-resolve\n`;
  if (irBypass) {
    yaml += `  - GEOIP,IR,DIRECT,no-resolve\n`;
  }
  yaml += `  - MATCH,✅ Selector\n`;
  return yaml;
}

function buildSingBoxConfig(entries) {
  const dnsHost = entries[0]?.s?.dns || '1.1.1.1';
  const irBypass = entries[0]?.s?.irBypass ?? true;

  const outbounds = entries.map(({ p, s }) => {
    if (p.protocol === 'wireguard') {
      const ep = parseEndpoint(p.endpoint);
      return {
        type: 'wireguard',
        tag: p.name,
        server: ep.host,
        server_port: ep.port,
        local_address: p.addresses,
        private_key: p.privateKey,
        peer_public_key: p.publicKey,
        mtu: s.mtu
      };
    }
    return {
      type: p.protocol,
      tag: p.name,
      server: p.host,
      server_port: p.port,
      uuid: p.uuid || p.password
    };
  });

  outbounds.push({ type: 'direct', tag: 'direct' });

  const routeRules = [];
  if (irBypass) {
    routeRules.push({
      geoip: ['private', 'ir'],
      outbound: 'direct'
    });
    routeRules.push({
      geosite: ['category-ir'],
      outbound: 'direct'
    });
  } else {
    routeRules.push({
      geoip: ['private'],
      outbound: 'direct'
    });
  }

  return {
    log: { level: 'info' },
    dns: {
      servers: [
        { tag: 'dns-remote', address: dnsHost }
      ]
    },
    inbounds: [
      {
        type: 'mixed',
        tag: 'mixed-in',
        listen: '127.0.0.1',
        listen_port: 10808
      }
    ],
    outbounds,
    route: { rules: routeRules }
  };
}

function buildXrayJsonConfig(entries) {
  const firstEntry = entries[0];
  const remarks = firstEntry?.p?.name || 'Config-1';
  const dnsHost = firstEntry?.s?.dns || '1.1.1.1';
  const irBypass = firstEntry?.s?.irBypass ?? true;

  const dnsServers = [
    { address: dnsHost, tag: 'remote-dns' }
  ];

  if (irBypass) {
    dnsServers.push({
      address: dnsHost,
      domains: ["geosite:category-ir", "regexp:.*\\.ir$"],
      expectIPs: ["geoip:ir"],
      skipFallback: true
    });
  }

  const outbounds = entries.map(({ p, s }) => {
    if (p.protocol === 'wireguard') {
      const ep = parseEndpoint(p.endpoint);
      const wgOutbound = {
        protocol: 'wireguard',
        tag: p.name,
        settings: {
          secretKey: p.privateKey,
          address: p.addresses,
          mtu: s.mtu,
          peers: [
            {
              endpoint: `${ep.host}:${ep.port}`,
              publicKey: p.publicKey,
              keepAlive: p.keepalive || s.keepalive || 25,
              allowedIPs: p.allowedIPs?.length ? p.allowedIPs : ['0.0.0.0/0', '::/0']
            }
          ]
        }
      };

      if (s.useNoise || s.useFragment) {
        wgOutbound.streamSettings = {};
        if (s.useNoise) {
          const jcCount = s.awg?.jc || 5;
          const jmin = s.awg?.jmin || 50;
          const jmax = s.awg?.jmax || 100;
          const noiseList = [];
          
          for (let i = 0; i < jcCount; i++) {
            noiseList.push({
              rand: `${jmin}-${jmax}`,
              randRange: "0-255",
              delay: "1-5"
            });
          }

          wgOutbound.streamSettings.finalmask = {
            udp: [
              {
                type: 'noise',
                settings: {
                  reset: '30-60',
                  noise: noiseList
                }
              }
            ]
          };
        }

        if (s.useFragment) {
          wgOutbound.streamSettings.sockopt = {
            dialerProxy: 'fragment',
            tcpKeepAliveInterval: 15
          };
        }
      }

      return wgOutbound;
    }

    return {
      protocol: p.protocol,
      tag: p.name,
      settings: {
        vnext: [{
          address: p.host,
          port: p.port,
          users: [{ id: p.uuid || p.password, encryption: 'none' }]
        }]
      }
    };
  });

  outbounds.push({ protocol: 'freedom', tag: 'direct' });
  outbounds.push({ protocol: 'blackhole', tag: 'block' });

  const routingRules = [];
  if (irBypass) {
    routingRules.push({
      type: 'field',
      ip: ['geoip:private', 'geoip:ir'],
      outboundTag: 'direct'
    });
    routingRules.push({
      type: 'field',
      domain: ['regexp:.*\\.ir$', 'geosite:category-ir'],
      outboundTag: 'direct'
    });
  } else {
    routingRules.push({
      type: 'field',
      ip: ['geoip:private'],
      outboundTag: 'direct'
    });
  }

  routingRules.push({
    type: 'field',
    network: 'tcp,udp',
    outboundTag: remarks
  });

  return {
    remarks,
    log: { loglevel: 'warning' },
    dns: {
      servers: dnsServers,
      queryStrategy: 'UseIP'
    },
    inbounds: [
      {
        listen: '0.0.0.0',
        port: 10808,
        protocol: 'mixed',
        settings: { auth: 'noauth', udp: true },
        sniffing: {
          destOverride: ['http', 'tls'],
          enabled: true,
          routeOnly: true
        },
        tag: 'mixed-in'
      }
    ],
    outbounds,
    routing: {
      domainStrategy: 'IPIfNonMatch',
      rules: routingRules
    }
  };
}

// ===================== CONVERT ENGINE =====================
function convert() {
  const defaultName = $('name').value.trim() || 'Config-1';
  parsedProxiesGlobal = [];

  if (currentMode === 'paste') {
    let input = $('inputData').value.trim();
    if (!input) return showStatus(false, ['Paste something first'], []);
    input = decodeBase64Safe(input);

    const lines = input.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    lines.forEach((line, index) => {
      if (line.startsWith('vless://') || line.startsWith('vmess://') || line.startsWith('trojan://')) {
        const parsed = parseUri(line);
        if (parsed) {
          if (lines.length > 1) parsed.name = `${parsed.name}-${index + 1}`;
          parsedProxiesGlobal.push({ ...parsed, settings: defaultSettings() });
        }
      }
    });

    if (parsedProxiesGlobal.length === 0) {
      const wg = parseWireGuard(input);
      if (wg.privateKey && wg.publicKey) {
        const defaults = defaultSettings();
        if (wg.awgParams) defaults.awg = { ...defaults.awg, ...wg.awgParams };
        parsedProxiesGlobal.push({ protocol: 'wireguard', name: defaultName, ...wg, settings: defaults });
      }
    }
  } else {
    const reserved = parseReserved($('manualReserved').value);
    parsedProxiesGlobal.push({
      protocol: 'wireguard', name: defaultName,
      privateKey: $('manualPrivate').value.trim(),
      publicKey: $('manualPublic').value.trim(),
      endpoint: $('manualEndpoint').value.trim(),
      addresses: [$('manualAddress').value.trim() || '172.16.0.2/32'],
      presharedKey: $('manualPSK').value.trim(),
      reserved,
      keepalive: parseInt($('manualKeepalive').value) || 25,
      allowedIPs: $('manualAllowed').value.trim().split(',').map(s => s.trim()),
      settings: defaultSettings()
    });
  }

  if (parsedProxiesGlobal.length === 0) {
    showStatus(false, ['Could not parse any valid configuration link or INI format.'], []);
    return;
  }

  renderList();
  buildCombinedExport();
  showStatus(true, [], [`Successfully processed ${parsedProxiesGlobal.length} profile(s)`]);
}

function renderList() {
  const container = $('configList');
  container.innerHTML = '';
  $('configCountText').innerText = `Parsed ${parsedProxiesGlobal.length} Config(s)`;
  parsedProxiesGlobal.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'config-item';
    const badgeClass = `badge-${item.protocol}`;
    const outputText = item.protocol === 'wireguard' ? buildAmneziaWG(item, item.settings) : (item.rawUri || JSON.stringify(item, null, 2));

    div.innerHTML = `
      <div class="config-summary" onclick="toggleDetails(${i})">
        <div class="config-info">
          <span class="badge ${badgeClass}">${item.protocol}</span>
          <span class="config-title">${escapeHtml(item.name)}</span>
        </div>
      </div>
      <div class="config-details" id="details-${i}">
        <textarea class="item-output" readonly>${escapeHtml(outputText)}</textarea>
      </div>
    `;
    container.appendChild(div);
  });
}

function toggleDetails(i) {
  const el = $(`details-${i}`);
  if (el) el.classList.toggle('open');
}

function toggleExpandAll() {
  allExpanded = !allExpanded;
  parsedProxiesGlobal.forEach((_, i) => {
    const el = $(`details-${i}`);
    if (el) el.classList.toggle('open', allExpanded);
  });
}

function buildCombinedExport() {
  if (!parsedProxiesGlobal.length) { $('result').value = ''; return; }
  const entries = parsedProxiesGlobal.map(p => ({ p, s: p.settings }));
  let result = '';
  if (currentTab === 'clash') result = buildClashConfig(entries);
  else if (currentTab === 'singbox') result = JSON.stringify(buildSingBoxConfig(entries), null, 2);
  else if (currentTab === 'json') result = JSON.stringify(buildXrayJsonConfig(entries), null, 2);
  else if (currentTab === 'amnezia') {
    const wg = parsedProxiesGlobal.find(p => p.protocol === 'wireguard');
    result = wg ? buildAmneziaWG(wg, wg.settings) : '# No WireGuard configuration available';
  }
  $('result').value = result;
  if ($('resultQrWrapper').classList.contains('active')) {
    generateResultQR();
  }
}

// ===================== QR CODE LOGIC =====================
function toggleResultQR() {
  const wrapper = $('resultQrWrapper');
  wrapper.classList.toggle('active');
  if (wrapper.classList.contains('active')) {
    generateResultQR();
  }
}

function generateResultQR() {
  const text = $('result').value.trim();
  const box = $('resultQrBox');
  const err = $('resultQrError');
  
  box.innerHTML = '';
  err.innerText = '';

  if (!text) {
    err.innerText = '⚠ Output is empty. Nothing to convert.';
    return;
  }

  if (text.length > 2048) {
    err.innerText = '❌ Text size exceeds QR code capacity limit. Please use "Copy Output" or download the config file instead.';
    return;
  }

  try {
    new QRCode(box, {
      text: text,
      width: 200,
      height: 200,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.M
    });
  } catch (e) {
    box.innerHTML = '';
    err.innerText = '❌ Configuration is too large to generate a QR code. Please copy or download the file instead.';
  }
}

function copyResult() {
  navigator.clipboard.writeText($('result').value);
  showStatus(true, [], ['Copied combined output to clipboard']);
}

function copyAllLinks() {
  const links = parsedProxiesGlobal.map(p => p.rawUri || buildAmneziaWG(p, p.settings)).join('\n\n');
  navigator.clipboard.writeText(links);
  showStatus(true, [], ['Copied all raw links to clipboard']);
}

function downloadResult() {
  const ext = currentTab === 'clash' ? 'yaml' : (currentTab === 'amnezia' ? 'conf' : 'json');
  const blob = new Blob([$('result').value], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `converted-config.${ext}`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function showStatus(ok, errors, warnings) {
  const s = $('status');
  if (!ok) { s.className = 'status error'; s.innerHTML = '❌ ' + errors.join('<br>'); return; }
  s.className = 'status success'; s.innerHTML = '✅ Ready';
}

function clearAll() {
  $('inputData').value = '';$('result').value = '';
  $('status').textContent = '';$('fetchLog').textContent = '';
  $('resultQrBox').innerHTML = '';$('resultQrError').innerText = '';
  parsedProxiesGlobal = [];
  renderList();
}
