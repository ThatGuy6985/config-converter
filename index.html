<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Universal Proxy & VPN Converter Pro v2</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --primary: #0ea5e9; --primary-hover: #0284c7;
      --text: #e2e8f0; --muted: #94a3b8;
      --success: #4ade80; --error: #f87171; --warn: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 20px; }
    .container { max-width: 1450px; margin: 0 auto; }
    h1 { text-align: center; color: var(--primary); margin-bottom: 4px; font-size: 26px; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 22px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    textarea, input, select {
      width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 9px 11px; font-family: ui-monospace, monospace; font-size: 12.5px;
    }
    textarea { min-height: 120px; resize: vertical; }
    .row { display: flex; gap: 10px; margin-bottom: 9px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 100px; }
    .checkbox { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
    .checkbox input { width: auto; }
    button { background: var(--primary); color: white; border: none; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button.success-btn { background: #16a34a; }
    button.success-btn:hover { background: #15803d; }
    button.warn-btn { background: #92400e; }
    button.warn-btn:hover { background: #78350f; }
    .btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
    .tab { padding: 6px 14px; background: #334155; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 500; }
    .tab.active { background: var(--primary); }
    .status { margin-top: 10px; font-size: 12.5px; min-height: 18px; }
    .success { color: var(--success); } .error { color: var(--error); } .warn { color: var(--warn); }
    .section-title { font-size: 13px; font-weight: 600; color: var(--primary); margin: 14px 0 8px 0; padding-bottom: 3px; border-bottom: 1px solid var(--border); }
    .mode-switch { display: flex; gap: 8px; margin-bottom: 12px; }
    .mode-btn { flex: 1; text-align: center; padding: 7px; background: #334155; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
    .mode-btn.active { background: var(--primary); }
    .hidden { display: none; }
    .action-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .config-item { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 7px; overflow: hidden; }
    .config-summary { display: flex; justify-content: space-between; align-items: center; padding: 9px 11px; cursor: pointer; }
    .config-summary:hover { background: #162032; }
    .config-info { display: flex; align-items: center; gap: 7px; flex: 1; overflow: hidden; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    .badge-vless { background: #0284c7; color: white; }
    .badge-trojan { background: #d97706; color: white; }
    .badge-vmess { background: #16a34a; color: white; }
    .badge-ss { background: #9333ea; color: white; }
    .badge-hysteria2, .badge-tuic { background: #db2777; color: white; }
    .badge-wireguard { background: #059669; color: white; }
    .badge-json { background: #7c3aed; color: white; }
    .badge-applied { background: #14532d; color: #4ade80; border: 1px solid #4ade80; }
    .config-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .config-details { padding: 9px 11px; border-top: 1px solid var(--border); background: #0a0f1d; display: none; }
    .config-details.open { display: block; }
    .link-box { word-break: break-all; font-family: monospace; font-size: 11px; color: #7dd3fc; background: #020617; padding: 7px; border-radius: 6px; border: 1px solid #1e293b; margin-top: 3px; }
    .item-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 9px 0; align-items: center; }
    .item-toolbar select { width: auto; padding: 5px 7px; font-size: 11.5px; }
    .item-toolbar button { padding: 4px 9px; font-size: 11px; }
    .item-status { font-size: 11px; margin: 3px 0; min-height: 14px; }
    .item-output { min-height: 130px; font-size: 11px; margin-top: 5px; }
    .fetch-log { font-size: 11px; color: var(--muted); margin-top: 5px; max-height: 80px; overflow-y: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Universal Proxy & VPN Converter Pro v2</h1>
    <p class="subtitle">URI Links • Full Xray JSON • WireGuard • Fragment • Noise • Smart IR Bypass</p>

    <div class="grid">
      <!-- LEFT PANEL -->
      <div class="card">
        <div class="mode-switch">
          <div class="mode-btn active" id="modePaste" onclick="setMode('paste')">Universal Import</div>
          <div class="mode-btn" id="modeManual" onclick="setMode('manual')">Manual WireGuard</div>
        </div>

        <label>Proxy Name / Tag Override</label>
        <input type="text" id="name" value="Config-1" style="margin-bottom:12px">

        <div id="pasteMode">
          <label>URI Links / Full Xray JSON / Base64 / Subscription URL</label>
          <textarea id="inputData" placeholder="Paste vless:// links, full Xray JSON configs, WireGuard INI, or subscription URL..." oninput="autoDetectName()"></textarea>
          <div style="margin-top:7px;display:flex;gap:7px;flex-wrap:wrap;">
            <button class="secondary" style="padding:5px 11px;font-size:12px;" onclick="fetchSubscription()">Fetch Online Sub</button>
          </div>
          <div id="fetchLog" class="fetch-log"></div>
        </div>

        <div id="manualMode" class="hidden">
          <div class="section-title">WireGuard Fields</div>
          <label>Private Key</label><input type="text" id="manualPrivate">
          <label style="margin-top:8px">Public Key</label><input type="text" id="manualPublic">
          <label style="margin-top:8px">Endpoint</label><input type="text" id="manualEndpoint" placeholder="ip:port">
          <div class="row" style="margin-top:8px">
            <div><label>IPv4</label><input type="text" id="manualAddress" value="10.2.0.2/32"></div>
            <div><label>IPv6 (optional)</label><input type="text" id="manualIPv6"></div>
          </div>
          <label style="margin-top:8px">AllowedIPs</label><input type="text" id="manualAllowed" value="0.0.0.0/0, ::/0">
          <label style="margin-top:8px">Preshared Key</label><input type="text" id="manualPSK">
        </div>

        <div class="section-title">Global Defaults</div>
        <div class="row">
          <div><label>Remote DNS</label><input type="text" id="dns" value="1.1.1.1"></div>
          <div><label>MTU</label><input type="number" id="mtu" value="1280"></div>
        </div>
        <div class="checkbox">
          <input type="checkbox" id="irBypass" checked>
          <label for="irBypass" style="margin:0;color:var(--text)">Default: IR Bypass ON</label>
        </div>
        <div class="checkbox">
          <input type="checkbox" id="useNoise" checked>
          <label for="useNoise" style="margin:0;color:var(--text)">Default: Noise ON</label>
        </div>
        <div class="checkbox">
          <input type="checkbox" id="useFragment" checked>
          <label for="useFragment" style="margin:0;color:var(--text)">Default: Fragment ON</label>
        </div>

        <div class="section-title">Fragment Settings</div>
        <div class="row">
          <div>
            <label>Preset</label>
            <select id="fragmentPreset" onchange="applyFragmentPreset()">
              <option value="light">Light (50-100 / 1)</option>
              <option value="normal" selected>Normal (100-200 / 1)</option>
              <option value="heavy">Heavy (10-50 / 1-2)</option>
              <option value="aggressive">Aggressive (1-20 / 1-1)</option>
              <option value="custom">Custom</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div>
            <label>Packets</label>
            <select id="fragPackets">
              <option value="tlshello" selected>tlshello</option>
              <option value="1-1">1-1</option>
              <option value="1-2">1-2</option>
              <option value="1-3">1-3</option>
            </select>
          </div>
          <div><label>Length</label><input type="text" id="fragLength" value="100-200"></div>
          <div><label>Delay</label><input type="text" id="fragDelay" value="1"></div>
        </div>

        <div class="section-title">UDP Noise</div>
        <div class="row">
          <div>
            <label>Preset</label>
            <select id="noisePreset" onchange="applyNoisePreset()">
              <option value="light">Light (3)</option>
              <option value="normal" selected>Normal (5)</option>
              <option value="strong">Strong (8)</option>
            </select>
          </div>
          <div><label>Count</label><input type="number" id="noiseCount" value="5" min="1" max="12"></div>
        </div>

        <div class="section-title">Amnezia WG</div>
        <div class="row">
          <div><label>Jc</label><input type="number" id="jc" value="5"></div>
          <div><label>Jmin</label><input type="number" id="jmin" value="50"></div>
          <div><label>Jmax</label><input type="number" id="jmax" value="100"></div>
        </div>
        <div class="row">
          <div><label>S1</label><input type="number" id="s1" value="0"></div>
          <div><label>S2</label><input type="number" id="s2" value="0"></div>
        </div>
        <div class="row">
          <div><label>H1</label><input type="number" id="h1" value="1"></div>
          <div><label>H2</label><input type="number" id="h2" value="2"></div>
          <div><label>H3</label><input type="number" id="h3" value="3"></div>
          <div><label>H4</label><input type="number" id="h4" value="4"></div>
        </div>

        <div class="btn-row">
          <button onclick="convert()">Parse / Refresh</button>
          <button class="secondary" onclick="randomizeAmnezia()">Randomize AWG</button>
          <button class="secondary" onclick="clearAll()">Clear</button>
        </div>
        <div id="status" class="status"></div>
      </div>

      <!-- RIGHT PANEL -->
      <div class="card">
        <div class="action-header">
          <div style="font-weight:600;color:var(--primary);font-size:14px;" id="configCountText">Parsed Configs</div>
          <div style="display:flex;gap:7px;">
            <button class="success-btn" style="padding:5px 11px;font-size:12px;" onclick="copyAllLinks()">Copy All Links</button>
            <button class="secondary" style="padding:5px 11px;font-size:12px;" onclick="toggleExpandAll()">Expand All</button>
          </div>
        </div>

        <div id="configList" style="max-height:420px;overflow-y:auto;margin-bottom:14px;"></div>

        <div class="section-title">Combined Export</div>
        <div class="tabs">
          <div class="tab active" onclick="switchTab('json', this)">Xray JSON</div>
          <div class="tab" onclick="switchTab('singbox', this)">Sing-Box</div>
          <div class="tab" onclick="switchTab('clash', this)">Clash Meta</div>
          <div class="tab" onclick="switchTab('amnezia', this)">AmneziaWG</div>
        </div>
        <textarea id="result" style="min-height:200px"></textarea>
        <div class="btn-row">
          <button onclick="copyResult()">Copy Combined</button>
          <button class="secondary" onclick="downloadResult()">Download</button>
        </div>
      </div>
    </div>
  </div>

<script>
let currentTab = 'json';
let currentMode = 'paste';
let parsedProxiesGlobal = [];
let allExpanded = false;
const $ = id => document.getElementById(id);

function decodeBase64Safe(str) {
  try {
    let clean = str.replace(/\s/g, '');
    while (clean.length % 4 !== 0) clean += '=';
    const decoded = atob(clean);
    if (decoded && (decoded.includes('://') || decoded.includes('{') || decoded.includes('['))) return decoded;
  } catch(e) {}
  return str;
}

function autoDetectName() {
  if (currentMode !== 'paste') return;
  let text = $('inputData').value.trim();
  if (!text) return;
  text = decodeBase64Safe(text);
  try {
    const j = JSON.parse(text);
    if (j.remarks) { $('name').value = j.remarks; return; }
  } catch(e) {}
  const firstLine = text.split('\n')[0].trim();
  if (firstLine.includes('#')) {
    const m = firstLine.match(/#([^#\r\n]+)$/);
    if (m && m[1].trim()) { $('name').value = decodeURIComponent(m[1].trim()); return; }
  }
}

function logFetch(msg) {
  const el = $('fetchLog');
  el.innerHTML += `<div>${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function fetchSubscription() {
  const rawUrl = $('inputData').value.trim().split('#')[0];
  if (!rawUrl.startsWith('http')) {
    showStatus(false, ['Enter a valid HTTP(S) URL'], []);
    return;
  }
  $('fetchLog').innerHTML = '';
  showStatus(true, [], ['Fetching...']);
  const proxies = [
    {label:'direct', build:u=>u},
    {label:'allorigins', build:u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`},
    {label:'codetabs', build:u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`},
    {label:'corsproxy', build:u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`}
  ];
  let data = null;
  for (const p of proxies) {
    try {
      logFetch(`Trying ${p.label}...`);
      const res = await fetch(p.build(rawUrl));
      if (res.ok) {
        const t = await res.text();
        if (t && t.trim().length > 10 && !t.trim().startsWith('<!')) {
          data = t; logFetch(`✅ ${p.label} OK`); break;
        }
      }
    } catch(e) { logFetch(`❌ ${p.label}`); }
  }
  if (!data) {
    showStatus(false, ['All fetch methods failed'], []);
    return;
  }
  $('inputData').value = decodeBase64Safe(data.trim());
  autoDetectName();
  convert();
}

function setMode(mode) {
  currentMode = mode;
  $('modePaste').classList.toggle('active', mode==='paste');
  $('modeManual').classList.toggle('active', mode==='manual');
  $('pasteMode').classList.toggle('hidden', mode!=='paste');
  $('manualMode').classList.toggle('hidden', mode!=='manual');
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  buildCombinedExport();
}

function applyNoisePreset() {
  const p = $('noisePreset').value;
  if (p==='light') $('noiseCount').value = 3;
  else if (p==='normal') $('noiseCount').value = 5;
  else if (p==='strong') $('noiseCount').value = 8;
}

function applyFragmentPreset() {
  const p = $('fragmentPreset').value;
  if (p==='light') { $('fragPackets').value='tlshello'; $('fragLength').value='50-100'; $('fragDelay').value='1'; }
  else if (p==='normal') { $('fragPackets').value='tlshello'; $('fragLength').value='100-200'; $('fragDelay').value='1'; }
  else if (p==='heavy') { $('fragPackets').value='tlshello'; $('fragLength').value='10-50'; $('fragDelay').value='1-2'; }
  else if (p==='aggressive') { $('fragPackets').value='tlshello'; $('fragLength').value='1-20'; $('fragDelay').value='1-1'; }
}

function randomizeAmnezia() {
  $('jc').value = Math.floor(Math.random()*8)+3;
  $('jmin').value = Math.floor(Math.random()*40)+20;
  $('jmax').value = Math.floor(Math.random()*80)+70;
  $('s1').value = Math.floor(Math.random()*50)+15;
  $('s2').value = Math.floor(Math.random()*50)+15;
  const r = () => Math.floor(Math.random()*2147483647)+1;
  $('h1').value=r(); $('h2').value=r(); $('h3').value=r(); $('h4').value=r();
  parsedProxiesGlobal.forEach(item => {
    if (item.protocol==='wireguard') {
      item.settings.awg = {
        jc:+$('jc').value, jmin:+$('jmin').value, jmax:+$('jmax').value,
        s1:+$('s1').value, s2:+$('s2').value,
        h1:+$('h1').value, h2:+$('h2').value, h3:+$('h3').value, h4:+$('h4').value
      };
    }
  });
  buildCombinedExport();
  renderList();
}

// ---------- PARSERS ----------

function parseUniversalLink(link, defaultName, index) {
  link = link.trim();
  if (!link) return null;
  let name = `${defaultName}-${index+1}`;
  const hashIndex = link.indexOf('#');
  if (hashIndex !== -1) name = decodeURIComponent(link.substring(hashIndex+1)).trim();
  const clean = hashIndex !== -1 ? link.substring(0, hashIndex) : link;
  const protocol = clean.split('://')[0].toLowerCase();

  if (['vless','trojan','ss','hysteria2','hy2','tuic'].includes(protocol)) {
    try {
      const main = clean.substring(protocol.length+3);
      const [authHost, qs] = main.split('?');
      const lastAt = authHost.lastIndexOf('@');
      const auth = lastAt !== -1 ? authHost.substring(0, lastAt) : '';
      const hostPort = lastAt !== -1 ? authHost.substring(lastAt+1) : authHost;
      let host = hostPort, port = 443;
      if (hostPort.includes(':')) {
        const lc = hostPort.lastIndexOf(':');
        port = parseInt(hostPort.substring(lc+1)) || 443;
        host = hostPort.substring(0, lc);
      }
      const params = new URLSearchParams(qs || '');
      return {
        protocol: protocol === 'hy2' ? 'hysteria2' : protocol,
        name, rawUri: link, uuid: auth, host, port,
        type: params.get('type') || params.get('net') || 'tcp',
        security: params.get('security') || (protocol==='trojan' ? 'tls' : 'none'),
        sni: params.get('sni') || params.get('peer') || host,
        path: params.get('path') || '/',
        hostHeader: params.get('host') || host,
        alpn: params.get('alpn') ? params.get('alpn').split(',') : undefined,
        fp: params.get('fp') || 'chrome',
        pbk: params.get('pbk') || '', sid: params.get('sid') || '',
        flow: params.get('flow') || '',
        serviceName: params.get('serviceName') || ''
      };
    } catch(e) { return null; }
  }
  if (protocol === 'vmess') {
    try {
      const json = JSON.parse(atob(clean.substring(8)));
      return {
        protocol: 'vmess', name: json.ps || name, rawUri: link, uuid: json.id,
        host: json.add, port: parseInt(json.port)||443, type: json.net||'tcp',
        security: json.tls||'none', sni: json.sni||json.host||json.add,
        path: json.path||'/', hostHeader: json.host||json.add,
        alpn: json.alpn ? json.alpn.split(',') : undefined, fp: json.fp||'chrome'
      };
    } catch(e) { return null; }
  }
  return null;
}

function parseWireGuard(text) {
  const r = { privateKey:'', addresses:[], publicKey:'', endpoint:'', presharedKey:'', keepalive:25, allowedIPs:[] };
  let section = '';
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.split('#')[0].split(';')[0].trim();
    if (!line) continue;
    if (line.startsWith('[') && line.endsWith(']')) { section = line.toLowerCase(); continue; }
    const eq = line.indexOf('=');
    if (eq === -1) continue;
    const k = line.slice(0,eq).trim().toLowerCase();
    const v = line.slice(eq+1).trim();
    if (section.includes('interface')) {
      if (k==='privatekey') r.privateKey = v;
      else if (k==='address') r.addresses = v.split(',').map(s=>s.trim());
    }
    if (section.includes('peer')) {
      if (k==='publickey') r.publicKey = v;
      else if (k==='endpoint') r.endpoint = v;
      else if (k==='presharedkey') r.presharedKey = v;
      else if (k==='persistentkeepalive') r.keepalive = parseInt(v)||25;
      else if (k==='allowedips') r.allowedIPs = v.split(',').map(s=>s.trim());
    }
  }
  return r;
}

// ---------- NEW: Full Xray JSON Parser ----------
function parseFullXrayJSON(text) {
  try {
    const conf = JSON.parse(text);
    if (!conf.outbounds || !Array.isArray(conf.outbounds)) return null;

    const results = [];
    conf.outbounds.forEach((ob, idx) => {
      if (!ob.protocol || ['freedom','blackhole','dns','block','direct'].includes(ob.protocol)) return;

      const item = {
        protocol: ob.protocol,
        name: ob.tag || conf.remarks || `proxy-${idx+1}`,
        rawUri: null,
        isFromJson: true,
        originalOutbound: ob,
        originalConfig: conf
      };

      if (ob.protocol === 'vless' || ob.protocol === 'vmess') {
        const vnext = ob.settings?.vnext?.[0] || ob.settings;
        item.host = vnext?.address || vnext?.address;
        item.port = vnext?.port || 443;
        item.uuid = vnext?.users?.[0]?.id || vnext?.id || '';
        item.flow = vnext?.users?.[0]?.flow || '';
      } else if (ob.protocol === 'trojan') {
        const s = ob.settings?.servers?.[0] || ob.settings;
        item.host = s?.address;
        item.port = s?.port || 443;
        item.uuid = s?.password || '';
      } else if (ob.protocol === 'wireguard') {
        item.privateKey = ob.settings?.secretKey;
        item.addresses = ob.settings?.address || [];
        item.publicKey = ob.settings?.peers?.[0]?.publicKey;
        item.endpoint = ob.settings?.peers?.[0]?.endpoint;
        item.presharedKey = ob.settings?.peers?.[0]?.preSharedKey || '';
        item.keepalive = ob.settings?.peers?.[0]?.keepAlive || 25;
        item.allowedIPs = ob.settings?.peers?.[0]?.allowedIPs || ['0.0.0.0/0','::/0'];
      }

      // Stream settings
      const ss = ob.streamSettings || {};
      item.type = ss.network || 'tcp';
      item.security = ss.security || 'none';
      if (ss.tlsSettings) {
        item.sni = ss.tlsSettings.serverName || item.host;
        item.fp = ss.tlsSettings.fingerprint || 'chrome';
        item.alpn = ss.tlsSettings.alpn;
      }
      if (ss.realitySettings) {
        item.sni = ss.realitySettings.serverName;
        item.fp = ss.realitySettings.fingerprint || 'chrome';
        item.pbk = ss.realitySettings.publicKey;
        item.sid = ss.realitySettings.shortId;
        item.security = 'reality';
      }
      if (ss.wsSettings) {
        item.path = ss.wsSettings.path || '/';
        item.hostHeader = ss.wsSettings.host || ss.wsSettings.headers?.Host || item.host;
      }

      results.push(item);
    });

    return results.length ? results : null;
  } catch(e) {
    return null;
  }
}

// ---------- BUILDERS ----------

function noiseBlock(count) {
  const n = Math.max(1, Math.min(12, count||5));
  return Array.from({length:n}, () => ({rand:'50-100', randRange:'0-255', delay:'1-5'}));
}

function buildXrayOutbound(p, s) {
  const tag = p.name;

  if (p.protocol === 'wireguard') {
    const out = {
      protocol: 'wireguard', tag,
      settings: {
        secretKey: p.privateKey,
        address: p.addresses,
        mtu: s.mtu,
        peers: [{
          endpoint: p.endpoint,
          publicKey: p.publicKey,
          ...(p.presharedKey ? {preSharedKey: p.presharedKey} : {}),
          keepAlive: p.keepalive,
          allowedIPs: p.allowedIPs?.length ? p.allowedIPs : ['0.0.0.0/0','::/0']
        }]
      }
    };
    if (s.awg) {
      out.settings.amnezia = {
        Jc: s.awg.jc, Jmin: s.awg.jmin, Jmax: s.awg.jmax,
        S1: s.awg.s1, S2: s.awg.s2,
        H1: s.awg.h1, H2: s.awg.h2, H3: s.awg.h3, H4: s.awg.h4
      };
    }
    // Noise for WireGuard
    if (s.noise) {
      out.streamSettings = {
        finalmask: {
          udp: [{
            type: 'noise',
            settings: {
              reset: '30-60',
              noise: noiseBlock(s.noiseCount)
            }
          }]
        }
      };
    }
    return out;
  }

  // VLESS / Trojan / VMess
  const streamSettings = {
    network: p.type === 'hy2' ? 'quic' : (p.type || 'tcp'),
    security: p.security || 'none'
  };

  if (p.security === 'tls') {
    streamSettings.tlsSettings = {
      serverName: p.sni || p.host,
      fingerprint: p.fp || 'chrome',
      ...(p.alpn ? {alpn: p.alpn} : {})
    };
  } else if (p.security === 'reality') {
    streamSettings.realitySettings = {
      serverName: p.sni,
      fingerprint: p.fp || 'chrome',
      publicKey: p.pbk,
      shortId: p.sid || '',
      spiderX: '/'
    };
  }

  if (p.type === 'ws') {
    streamSettings.wsSettings = {
      path: p.path || '/',
      headers: { Host: p.hostHeader || p.host }
    };
  } else if (p.type === 'grpc') {
    streamSettings.grpcSettings = { serviceName: p.serviceName || '', multiMode: true };
  }

  // Fragment
  if (s.fragment) {
    streamSettings.finalmask = {
      tcp: [{
        type: 'fragment',
        settings: {
          packets: s.fragPackets || 'tlshello',
          length: s.fragLength || '100-200',
          delay: s.fragDelay || '1'
        }
      }]
    };
  }

  // Noise (udp)
  if (s.noise) {
    if (!streamSettings.finalmask) streamSettings.finalmask = {};
    streamSettings.finalmask.udp = [{
      type: 'noise',
      settings: {
        reset: '30-60',
        noise: noiseBlock(s.noiseCount)
      }
    }];
  }

  const out = {
    protocol: p.protocol,
    tag,
    settings: {},
    streamSettings
  };

  if (p.protocol === 'vless') {
    out.settings.vnext = [{
      address: p.host,
      port: p.port,
      users: [{ id: p.uuid, encryption: 'none', ...(p.flow ? {flow: p.flow} : {}) }]
    }];
  } else if (p.protocol === 'trojan') {
    out.settings.servers = [{ address: p.host, port: p.port, password: p.uuid }];
  } else if (p.protocol === 'vmess') {
    out.settings.vnext = [{
      address: p.host,
      port: p.port,
      users: [{ id: p.uuid, alterId: 0, security: 'auto' }]
    }];
  }

  return out;
}

function buildXrayConfig(proxyEntries) {
  const outbounds = proxyEntries.map(({p, s}) => buildXrayOutbound(p, s));
  outbounds.push({ protocol: 'freedom', tag: 'direct' });
  outbounds.push({ protocol: 'blackhole', tag: 'block' });

  const anyIr = proxyEntries.some(({s}) => s.irBypass);
  const dns = proxyEntries[0]?.s.dns || '1.1.1.1';
  const mainTag = outbounds[0].tag;

  return {
    remarks: $('name').value.trim() || 'Converted-Config',
    log: { loglevel: 'warning' },
    dns: {
      servers: [
        { address: dns, tag: 'remote-dns' },
        { address: '1.1.1.1', domains: ['geosite:category-ir', 'regexp:.*\\.ir$'], expectIPs: ['geoip:ir'], skipFallback: true }
      ],
      queryStrategy: 'UseIP'
    },
    inbounds: [{
      listen: '0.0.0.0',
      port: 10808,
      protocol: 'mixed',
      settings: { auth: 'noauth', udp: true },
      sniffing: { destOverride: ['http','tls'], enabled: true, routeOnly: true },
      tag: 'mixed-in'
    }],
    outbounds,
    routing: {
      domainStrategy: 'IPIfNonMatch',
      rules: [
        ...(anyIr ? [
          { type: 'field', ip: ['geoip:private', 'geoip:ir'], outboundTag: 'direct' },
          { type: 'field', domain: ['regexp:.*\\.ir$', 'geosite:category-ir'], outboundTag: 'direct' }
        ] : [
          { type: 'field', ip: ['geoip:private'], outboundTag: 'direct' }
        ]),
        { type: 'field', network: 'tcp,udp', outboundTag: mainTag }
      ]
    }
  };
}

function buildSingBoxOutbound(p, s) {
  // simplified for brevity – same logic as before
  if (p.protocol === 'wireguard') {
    return {
      type: 'wireguard', tag: p.name,
      server: p.endpoint?.split(':')[0],
      server_port: parseInt(p.endpoint?.split(':')[1]) || 51820,
      local_address: p.addresses,
      private_key: p.privateKey,
      peer_public_key: p.publicKey,
      mtu: s.mtu
    };
  }
  return {
    type: p.protocol, tag: p.name,
    server: p.host, server_port: p.port,
    uuid: p.protocol==='vless' ? p.uuid : undefined,
    password: p.protocol==='trojan' ? p.uuid : undefined,
    tls: (p.security==='tls'||p.security==='reality') ? {
      enabled: true, server_name: p.sni,
      utls: { enabled: true, fingerprint: p.fp||'chrome' }
    } : undefined,
    transport: p.type==='ws' ? { type:'ws', path: p.path, headers:{Host: p.hostHeader} } : undefined
  };
}

function buildSingBoxConfig(entries) {
  const outbounds = entries.map(({p,s}) => buildSingBoxOutbound(p,s));
  outbounds.push({ type:'direct', tag:'direct' });
  const anyIr = entries.some(({s}) => s.irBypass);
  return {
    log: { level: 'info' },
    dns: { servers: [{ tag:'dns-remote', address: entries[0]?.s.dns || '1.1.1.1' }] },
    inbounds: [{ type:'mixed', tag:'mixed-in', listen:'127.0.0.1', listen_port:10808 }],
    outbounds,
    route: {
      rules: anyIr
        ? [{ geoip:['private','ir'], outbound:'direct' }, { geosite:['category-ir'], outbound:'direct' }]
        : [{ geoip:['private'], outbound:'direct' }]
    }
  };
}

function buildClashProxy(p, s) {
  if (p.protocol === 'wireguard') {
    return {
      name: p.name, type: 'wireguard',
      server: p.endpoint?.split(':')[0],
      port: parseInt(p.endpoint?.split(':')[1])||51820,
      'private-key': p.privateKey, 'public-key': p.publicKey,
      ip: p.addresses?.[0]?.split('/')[0], mtu: s.mtu, udp: true
    };
  }
  return {
    name: p.name, type: p.protocol,
    server: p.host, port: p.port,
    uuid: p.protocol==='vless' ? p.uuid : undefined,
    password: p.protocol==='trojan' ? p.uuid : undefined,
    tls: p.security==='tls' || p.security==='reality',
    servername: p.sni, network: p.type,
    'ws-opts': p.type==='ws' ? { path: p.path, headers:{Host: p.hostHeader} } : undefined
  };
}

function buildClashConfig(entries) {
  const proxies = entries.map(({p,s}) => buildClashProxy(p,s));
  const anyIr = entries.some(({s}) => s.irBypass);
  return `port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
proxies:
${JSON.stringify(proxies, null, 2)}
proxy-groups:
  - name: PROXY
    type: select
    proxies:
${proxies.map(p => `      - "${p.name}"`).join('\n')}
rules:
${anyIr ? '  - GEOIP,IR,DIRECT\n  - GEOSITE,category-ir,DIRECT\n' : ''}  - GEOIP,PRIVATE,DIRECT
  - MATCH,PROXY`;
}

function buildAmneziaWG(p, s) {
  const awg = s.awg || {jc:5,jmin:50,jmax:100,s1:0,s2:0,h1:1,h2:2,h3:3,h4:4};
  return `[Interface]
PrivateKey = ${p.privateKey}
Address = ${p.addresses.join(', ')}
DNS = ${s.dns}
MTU = ${s.mtu}
Jc = ${awg.jc}
Jmin = ${awg.jmin}
Jmax = ${awg.jmax}
S1 = ${awg.s1}
S2 = ${awg.s2}
H1 = ${awg.h1}
H2 = ${awg.h2}
H3 = ${awg.h3}
H4 = ${awg.h4}

[Peer]
PublicKey = ${p.publicKey}
AllowedIPs = ${p.allowedIPs?.length ? p.allowedIPs.join(', ') : '0.0.0.0/0, ::/0'}
Endpoint = ${p.endpoint}
PersistentKeepalive = ${p.keepalive}${p.presharedKey ? `\nPresharedKey = ${p.presharedKey}` : ''}`;
}

// ---------- DEFAULT SETTINGS & UI ----------

function defaultSettings() {
  return {
    irBypass: $('irBypass').checked,
    noise: $('useNoise').checked,
    noiseCount: parseInt($('noiseCount').value) || 5,
    fragment: $('useFragment').checked,
    fragPackets: $('fragPackets').value || 'tlshello',
    fragLength: $('fragLength').value.trim() || '100-200',
    fragDelay: $('fragDelay').value.trim() || '1',
    dns: $('dns').value.trim() || '1.1.1.1',
    mtu: parseInt($('mtu').value) || 1280,
    awg: null
  };
}

function renderList() {
  const container = $('configList');
  container.innerHTML = '';
  $('configCountText').innerText = `Parsed ${parsedProxiesGlobal.length} Config(s)`;

  parsedProxiesGlobal.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'config-item';

    let badgeClass = 'badge-vless';
    if (item.protocol==='trojan') badgeClass = 'badge-trojan';
    if (item.protocol==='vmess') badgeClass = 'badge-vmess';
    if (item.protocol==='wireguard') badgeClass = 'badge-wireguard';
    if (item.isFromJson) badgeClass = 'badge-json';

    const irBadge = item.settings.irBypass ? `<span class="badge badge-applied">IR</span>` : '';
    const fragBadge = item.settings.fragment ? `<span class="badge badge-applied">FRAG</span>` : '';
    const noiseBadge = item.settings.noise ? `<span class="badge badge-applied">NOISE</span>` : '';

    div.innerHTML = `
      <div class="config-summary" onclick="toggleDetails(${i})">
        <div class="config-info">
          <span class="badge ${badgeClass}">${item.protocol}${item.isFromJson?' JSON':''}</span>
          <span class="config-title">${escapeHtml(item.name)}</span>
          ${irBadge}${fragBadge}${noiseBadge}
        </div>
        <div onclick="event.stopPropagation()">
          <button class="secondary" style="padding:3px 8px;font-size:11px;" onclick="copySingleLink(${i})">Copy</button>
        </div>
      </div>
      <div class="config-details" id="details-${i}">
        <div class="item-toolbar">
          <button class="${item.settings.irBypass?'warn-btn':''}" onclick="toggleIrBypass(${i})">
            ${item.settings.irBypass ? 'Remove IR Bypass' : 'Apply IR Bypass'}
          </button>
          ${item.protocol !== 'wireguard' ? `
            <button class="${item.settings.fragment?'warn-btn':''}" onclick="toggleFragment(${i})">
              ${item.settings.fragment ? 'Remove Fragment' : 'Apply Fragment'}
            </button>
            <button class="${item.settings.noise?'warn-btn':''}" onclick="toggleNoise(${i})">
              ${item.settings.noise ? 'Remove Noise' : 'Apply Noise'}
            </button>
          ` : `
            <button onclick="applyAwg(${i})">Apply Amnezia</button>
          `}
          <select id="fmt-${i}" onchange="generateIndividual(${i})">
            <option value="xray">Xray JSON</option>
            <option value="singbox">Sing-Box</option>
            <option value="clash">Clash</option>
            ${item.protocol==='wireguard' ? '<option value="amnezia">AmneziaWG</option>' : ''}
          </select>
          <button class="secondary" onclick="generateIndividual(${i})">Generate</button>
          <button class="success-btn" onclick="copyIndividualOutput(${i})">Copy This</button>
        </div>
        <div class="item-status" id="itemstatus-${i}"></div>
        <textarea class="item-output" id="itemoutput-${i}" readonly></textarea>
      </div>
    `;
    container.appendChild(div);
  });
}

function itemMsg(i, cls, msg) {
  const el = $(`itemstatus-${i}`);
  if (el) { el.className = `item-status ${cls}`; el.innerText = msg; }
}

function toggleIrBypass(i) {
  const item = parsedProxiesGlobal[i];
  item.settings.irBypass = !item.settings.irBypass;
  itemMsg(i, item.settings.irBypass ? 'success' : 'warn',
    item.settings.irBypass ? 'IR Bypass applied (clean style)' : 'IR Bypass removed');
  renderList();
  $(`details-${i}`)?.classList.add('open');
  generateIndividual(i);
}

function toggleFragment(i) {
  const item = parsedProxiesGlobal[i];
  item.settings.fragPackets = $('fragPackets').value;
  item.settings.fragLength = $('fragLength').value.trim() || '100-200';
  item.settings.fragDelay = $('fragDelay').value.trim() || '1';
  item.settings.fragment = !item.settings.fragment;
  itemMsg(i, item.settings.fragment ? 'success' : 'warn',
    item.settings.fragment
      ? `Fragment ON (${item.settings.fragPackets} / ${item.settings.fragLength} / ${item.settings.fragDelay})`
      : 'Fragment removed');
  renderList();
  $(`details-${i}`)?.classList.add('open');
  generateIndividual(i);
}

function toggleNoise(i) {
  const item = parsedProxiesGlobal[i];
  item.settings.noiseCount = parseInt($('noiseCount').value) || 5;
  item.settings.noise = !item.settings.noise;
  itemMsg(i, item.settings.noise ? 'success' : 'warn',
    item.settings.noise ? 'Noise applied' : 'Noise removed');
  renderList();
  $(`details-${i}`)?.classList.add('open');
  generateIndividual(i);
}

function applyAwg(i) {
  const item = parsedProxiesGlobal[i];
  item.settings.awg = {
    jc:+$('jc').value, jmin:+$('jmin').value, jmax:+$('jmax').value,
    s1:+$('s1').value, s2:+$('s2').value,
    h1:+$('h1').value, h2:+$('h2').value, h3:+$('h3').value, h4:+$('h4').value
  };
  itemMsg(i, 'success', 'Amnezia parameters applied');
  renderList();
  $(`details-${i}`)?.classList.add('open');
  generateIndividual(i);
}

function generateIndividual(index) {
  const item = parsedProxiesGlobal[index];
  const fmt = $(`fmt-${index}`)?.value || 'xray';
  const out = $(`itemoutput-${index}`);
  if (!out) return;
  const entry = { p: item, s: item.settings };
  let text = '';
  if (fmt === 'xray') text = JSON.stringify(buildXrayConfig([entry]), null, 2);
  else if (fmt === 'singbox') text = JSON.stringify(buildSingBoxConfig([entry]), null, 2);
  else if (fmt === 'clash') text = buildClashConfig([entry]);
  else if (fmt === 'amnezia') text = item.protocol==='wireguard' ? buildAmneziaWG(item, item.settings) : '# Only for WireGuard';
  out.value = text;
}

function toggleDetails(i) {
  const el = $(`details-${i}`);
  if (el) {
    el.classList.toggle('open');
    if (el.classList.contains('open') && !$(`itemoutput-${i}`).value) generateIndividual(i);
  }
}

function toggleExpandAll() {
  allExpanded = !allExpanded;
  parsedProxiesGlobal.forEach((_, i) => {
    const el = $(`details-${i}`);
    if (el) {
      if (allExpanded) {
        el.classList.add('open');
        if (!$(`itemoutput-${i}`).value) generateIndividual(i);
      } else el.classList.remove('open');
    }
  });
}

function copySingleLink(i) {
  const item = parsedProxiesGlobal[i];
  const text = item.rawUri || `${item.protocol}://${item.host}:${item.port}`;
  navigator.clipboard.writeText(text).then(() => showStatus(true, [], [`Copied ${item.name}`]));
}

function copyIndividualOutput(i) {
  const out = $(`itemoutput-${i}`);
  if (!out?.value) generateIndividual(i);
  navigator.clipboard.writeText($(`itemoutput-${i}`).value)
    .then(() => itemMsg(i, 'success', 'Copied!'));
}

function copyAllLinks() {
  const text = parsedProxiesGlobal.map(p => p.rawUri || `${p.protocol}://${p.host}:${p.port}`).join('\n');
  navigator.clipboard.writeText(text).then(() => showStatus(true, [], [`Copied ${parsedProxiesGlobal.length} links`]));
}

function buildCombinedExport() {
  if (!parsedProxiesGlobal.length) { $('result').value = ''; return; }
  const entries = parsedProxiesGlobal.map(p => ({p, s: p.settings}));
  let result = '';
  if (currentTab === 'json') result = JSON.stringify(buildXrayConfig(entries), null, 2);
  else if (currentTab === 'singbox') result = JSON.stringify(buildSingBoxConfig(entries), null, 2);
  else if (currentTab === 'clash') result = buildClashConfig(entries);
  else if (currentTab === 'amnezia') {
    const wg = parsedProxiesGlobal.find(p => p.protocol==='wireguard');
    result = wg ? buildAmneziaWG(wg, wg.settings) : '# No WireGuard found';
  }
  $('result').value = result;
}

function convert() {
  const name = $('name').value.trim() || 'Config-1';
  parsedProxiesGlobal = [];

  if (currentMode === 'paste') {
    let input = $('inputData').value.trim();
    if (!input) {
      showStatus(false, ['Please paste something'], []);
      return;
    }
    input = decodeBase64Safe(input);

    // 1. Try full Xray JSON first
    const jsonItems = parseFullXrayJSON(input);
    if (jsonItems) {
      jsonItems.forEach(item => {
        item.settings = defaultSettings();
        parsedProxiesGlobal.push(item);
      });
    } else {
      // 2. Try URI links
      const lines = input.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      let idx = 0;
      for (const line of lines) {
        if (line.includes('://')) {
          const parsed = parseUniversalLink(line, name, idx++);
          if (parsed) {
            parsed.settings = defaultSettings();
            parsedProxiesGlobal.push(parsed);
          }
        }
      }
      // 3. Try WireGuard INI
      if (!parsedProxiesGlobal.length) {
        const wg = parseWireGuard(input);
        if (wg.privateKey && wg.publicKey) {
          parsedProxiesGlobal.push({
            protocol: 'wireguard', name, ...wg, settings: defaultSettings()
          });
        }
      }
    }
  } else {
    // Manual WireGuard
    const ipv4 = $('manualAddress').value.trim() || '10.2.0.2/32';
    const ipv6 = $('manualIPv6').value.trim();
    parsedProxiesGlobal.push({
      protocol: 'wireguard', name,
      privateKey: $('manualPrivate').value.trim(),
      publicKey: $('manualPublic').value.trim(),
      endpoint: $('manualEndpoint').value.trim(),
      addresses: ipv6 ? [ipv4, ipv6] : [ipv4],
      presharedKey: $('manualPSK').value.trim(),
      allowedIPs: $('manualAllowed').value.trim().split(',').map(s=>s.trim()),
      keepalive: 25,
      settings: defaultSettings()
    });
  }

  if (!parsedProxiesGlobal.length) {
    showStatus(false, ['Could not parse any valid config'], []);
    renderList();
    return;
  }

  renderList();
  buildCombinedExport();
  showStatus(true, [], [`Successfully processed ${parsedProxiesGlobal.length} profile(s)`]);
}

function showStatus(ok, errors, warnings) {
  const status = $('status');
  if (!ok) {
    status.className = 'status error';
    status.innerHTML = '❌ ' + errors.join('<br>');
    return;
  }
  status.className = 'status success';
  let msg = '✅ Ready';
  if (warnings.length) msg += '<br>⚠️ ' + warnings.join('<br>');
  status.innerHTML = msg;
}

function copyResult() {
  if (!$('result').value) return;
  navigator.clipboard.writeText($('result').value)
    .then(() => showStatus(true, [], ['Copied combined export']));
}

function downloadResult() {
  const content = $('result').value;
  if (!content) return;
  const name = $('name').value.trim() || 'config';
  const ext = {json:'json', singbox:'json', clash:'yaml', amnezia:'conf'}[currentTab] || 'txt';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type:'text/plain'}));
  a.download = `${name}.${ext}`;
  a.click();
}

function clearAll() {
  $('inputData').value = '';
  $('result').value = '';
  $('status').textContent = '';
  $('fetchLog').innerHTML = '';
  $('name').value = 'Config-1';
  parsedProxiesGlobal = [];
  renderList();
}

function escapeHtml(str) {
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Init
applyNoisePreset();
applyFragmentPreset();
