<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WireGuard Converter Pro</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --primary: #0ea5e9;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --success: #4ade80;
      --error: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }
    .container { max-width: 1300px; margin: 0 auto; }
    h1 { text-align: center; color: var(--primary); margin-bottom: 4px; font-size: 28px; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
    textarea, input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-family: ui-monospace, monospace;
      font-size: 13px;
    }
    textarea { min-height: 140px; resize: vertical; }
    .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 110px; }
    .checkbox { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    .checkbox input { width: auto; }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s;
    }
    button:hover { background: #0284c7; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab {
      padding: 7px 16px;
      background: #334155;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .tab.active { background: var(--primary); }
    .status { margin-top: 12px; font-size: 13px; min-height: 20px; }
    .success { color: var(--success); }
    .error { color: var(--error); }
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
      margin: 16px 0 10px 0;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .mode-switch {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .mode-btn {
      flex: 1;
      text-align: center;
      padding: 8px;
      background: #334155;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .mode-btn.active { background: var(--primary); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>WireGuard Converter Pro</h1>
    <p class="subtitle">Full Config or Manual Input → Amnezia + Clash + Xray | IR Bypass & Noise</p>

    <div class="grid">
      <!-- ================= LEFT PANEL ================= -->
      <div class="card">
        <!-- Mode Switch -->
        <div class="mode-switch">
          <div class="mode-btn active" id="modePaste" onclick="setMode('paste')">Paste Full Config</div>
          <div class="mode-btn" id="modeManual" onclick="setMode('manual')">Manual Input</div>
        </div>

        <!-- Proxy Name -->
        <label>Proxy Name</label>
        <input type="text" id="name" value="My-WG" style="margin-bottom:14px">

        <!-- ===== PASTE MODE ===== -->
        <div id="pasteMode">
          <label>WireGuard Config</label>
          <textarea id="wg" placeholder="Paste your full [Interface] + [Peer] config here..."></textarea>
        </div>

        <!-- ===== MANUAL MODE ===== -->
        <div id="manualMode" class="hidden">
          <div class="section-title">Essential Fields</div>
          <label>Private Key</label>
          <input type="text" id="manualPrivate" placeholder="PrivateKey = ...">

          <label style="margin-top:10px">Public Key</label>
          <input type="text" id="manualPublic" placeholder="PublicKey = ...">

          <label style="margin-top:10px">Endpoint (IP or Domain)</label>
          <input type="text" id="manualEndpoint" placeholder="example.com or 1.2.3.4">

          <div class="row" style="margin-top:10px">
            <div>
              <label>Port</label>
              <input type="number" id="manualPort" value="51820">
            </div>
            <div>
              <label>Address (IPv4)</label>
              <input type="text" id="manualAddress" value="10.2.0.2/32">
            </div>
          </div>

          <label style="margin-top:10px">Preshared Key (optional)</label>
          <input type="text" id="manualPSK" placeholder="Leave empty if none">
        </div>

        <!-- Common Settings -->
        <div class="section-title">Extra Settings</div>
        <div class="row">
          <div>
            <label>DNS</label>
            <input type="text" id="dns" value="1.1.1.1">
          </div>
          <div>
            <label>MTU</label>
            <input type="number" id="mtu" value="1280">
          </div>
          <div>
            <label>KeepAlive</label>
            <input type="number" id="keepalive" value="25">
          </div>
        </div>

        <div class="checkbox">
          <input type="checkbox" id="irBypass" checked>
          <label for="irBypass" style="margin:0;color:var(--text)">Add IR Bypass rules</label>
        </div>
        <div class="checkbox">
          <input type="checkbox" id="useNoise" checked>
          <label for="useNoise" style="margin:0;color:var(--text)">Enable Noise / finalmask (Xray)</label>
        </div>

        <!-- Amnezia Parameters -->
        <div class="section-title">Amnezia Parameters</div>
        <div class="row">
          <div><label>Jc</label><input type="number" id="jc" value="5"></div>
          <div><label>Jmin</label><input type="number" id="jmin" value="50"></div>
          <div><label>Jmax</label><input type="number" id="jmax" value="100"></div>
        </div>
        <div class="row">
          <div><label>S1</label><input type="number" id="s1" value="0"></div>
          <div><label>S2</label><input type="number" id="s2" value="0"></div>
        </div>
        <div class="row">
          <div><label>H1</label><input type="number" id="h1" value="1"></div>
          <div><label>H2</label><input type="number" id="h2" value="2"></div>
          <div><label>H3</label><input type="number" id="h3" value="3"></div>
          <div><label>H4</label><input type="number" id="h4" value="4"></div>
        </div>

        <div class="btn-row">
          <button onclick="convert()">Convert</button>
          <button class="secondary" onclick="clearAll()">Clear</button>
        </div>
        <div id="status" class="status"></div>
      </div>

      <!-- ================= RIGHT PANEL ================= -->
      <div class="card">
        <div class="tabs">
          <div class="tab active" onclick="switchTab('json', this)">Xray JSON</div>
          <div class="tab" onclick="switchTab('clash', this)">Clash YAML</div>
          <div class="tab" onclick="switchTab('amnezia', this)">Amnezia Conf</div>
        </div>

        <label>Result (editable)</label>
        <textarea id="result" style="min-height: 560px"></textarea>

        <div class="btn-row">
          <button onclick="copyResult()">Copy to Clipboard</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'json';
    let currentMode = 'paste';

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modePaste').classList.toggle('active', mode === 'paste');
      document.getElementById('modeManual').classList.toggle('active', mode === 'manual');
      document.getElementById('pasteMode').classList.toggle('hidden', mode !== 'paste');
      document.getElementById('manualMode').classList.toggle('hidden', mode !== 'manual');
    }

    function switchTab(tab, element) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (element) element.classList.add('active');
      convert();
    }

    function parseWG(text) {
      const r = {
        privateKey: '', address: '', dns: '',
        publicKey: '', endpoint: '', presharedKey: '',
        keepalive: 25
      };
      let section = '';
      for (let rawLine of text.split('\n')) {
        let line = rawLine.split('#')[0].split(';')[0].trim();
        if (!line) continue;
        if (line.startsWith('[')) {
          section = line.toLowerCase();
          continue;
        }
        const eq = line.indexOf('=');
        if (eq === -1) continue;
        const key = line.slice(0, eq).trim().toLowerCase();
        const value = line.slice(eq + 1).trim();

        if (section.includes('interface')) {
          if (key === 'privatekey') r.privateKey = value;
          if (key === 'address') r.address = value;
          if (key === 'dns') r.dns = value;
        }
        if (section.includes('peer')) {
          if (key === 'publickey') r.publicKey = value;
          if (key === 'endpoint') r.endpoint = value;
          if (key === 'presharedkey') r.presharedKey = value;
          if (key === 'persistentkeepalive') r.keepalive = parseInt(value) || 25;
        }
      }
      return r;
    }

    function convert() {
      const status = document.getElementById('status');
      const name = document.getElementById('name').value.trim() || 'My-WG';
      const irBypass = document.getElementById('irBypass').checked;
      const useNoise = document.getElementById('useNoise').checked;
      const mtu = document.getElementById('mtu').value || 1280;
      const dnsInput = document.getElementById('dns').value.trim() || '1.1.1.1';
      const keepaliveInput = parseInt(document.getElementById('keepalive').value) || 25;

      let d = {};

      if (currentMode === 'paste') {
        const input = document.getElementById('wg').value.trim();
        if (!input) {
          status.className = 'status error';
          status.textContent = 'Please paste a WireGuard config.';
          return;
        }
        d = parseWG(input);
      } else {
        // Manual mode
        d.privateKey = document.getElementById('manualPrivate').value.trim();
        d.publicKey = document.getElementById('manualPublic').value.trim();
        d.endpoint = document.getElementById('manualEndpoint').value.trim();
        const port = document.getElementById('manualPort').value || 51820;
        if (d.endpoint && !d.endpoint.includes(':')) {
          d.endpoint = d.endpoint + ':' + port;
        }
        d.address = document.getElementById('manualAddress').value.trim() || '10.2.0.2/32';
        d.presharedKey = document.getElementById('manualPSK').value.trim();
        d.dns = dnsInput;
        d.keepalive = keepaliveInput;
      }

      // Validation
      if (!d.privateKey || !d.publicKey || !d.endpoint) {
        status.className = 'status error';
        status.textContent = 'Missing required fields: PrivateKey, PublicKey or Endpoint';
        return;
      }

      // Amnezia params
      const jc = document.getElementById('jc').value;
      const jmin = document.getElementById('jmin').value;
      const jmax = document.getElementById('jmax').value;
      const s1 = document.getElementById('s1').value;
      const s2 = document.getElementById('s2').value;
      const h1 = document.getElementById('h1').value;
      const h2 = document.getElementById('h2').value;
      const h3 = document.getElementById('h3').value;
      const h4 = document.getElementById('h4').value;

      // Address
      let addresses = d.address ? d.address.split(',').map(s => s.trim()) : ['10.2.0.2/32'];
      let ipv4 = addresses.find(a => !a.includes(':')) || '10.2.0.2/32';
      let ipv6 = addresses.find(a => a.includes(':')) || '';

      // Endpoint split
      let server = d.endpoint;
      let port = 51820;
      if (d.endpoint.includes(':')) {
        const idx = d.endpoint.lastIndexOf(':');
        server = d.endpoint.slice(0, idx);
        port = d.endpoint.slice(idx + 1);
      }

      const dnsServer = d.dns || dnsInput;
      let result = '';

      // ========== AMNEZIA ==========
      if (currentTab === 'amnezia') {
        result = `[Interface]
PrivateKey = ${d.privateKey}
Address = ${d.address || '10.2.0.2/32'}
DNS = ${dnsServer}
MTU = ${mtu}
Jc = ${jc}
Jmin = ${jmin}
Jmax = ${jmax}
S1 = ${s1}
S2 = ${s2}
H1 = ${h1}
H2 = ${h2}
H3 = ${h3}
H4 = ${h4}

[Peer]
PublicKey = ${d.publicKey}
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = ${d.endpoint}
PersistentKeepalive = ${d.keepalive || keepaliveInput}`;
        if (d.presharedKey) result += `\nPresharedKey = ${d.presharedKey}`;
      }

      // ========== CLASH ==========
      else if (currentTab === 'clash') {
        const irRule = irBypass ? `  - GEOIP,IR,DIRECT,no-resolve\n` : '';

        result = `mixed-port: 7890
ipv6: true
allow-lan: true
unified-delay: false
log-level: warning
mode: rule
geo-auto-update: true
geo-update-interval: 168
external-controller: 127.0.0.1:9090
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true
external-ui: ui
external-ui-url: https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip
profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  respect-rules: true
  use-system-hosts: false
  listen: 0.0.0.0:1053
  ipv6: false
  nameserver:
    - ${dnsServer}#${name}
    - 1.1.1.1#${name}
  proxy-server-nameserver:
    - 8.8.8.8#DIRECT
  direct-nameserver:
    - 8.8.8.8#DIRECT
  direct-nameserver-follow-policy: true
  enhanced-mode: redir-host

tun:
  enable: true
  stack: mixed
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  mtu: 9000

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080, 8880, 2052, 2082, 2086, 2095]
    TLS:
      ports: [443, 8443, 2053, 2083, 2087, 2096]

proxies:
  - name: "${name}"
    type: wireguard
    ip: ${ipv4}
    ${ipv6 ? 'ipv6: ' + ipv6 + '\n    ip-version: dual' : 'ip-version: ipv4'}
    private-key: ${d.privateKey}
    server: ${server}
    port: ${port}
    public-key: ${d.publicKey}
    ${d.presharedKey ? 'pre-shared-key: ' + d.presharedKey : ''}
    allowed-ips:
      - 0.0.0.0/0
      - ::/0
    persistent-keepalive: ${d.keepalive || keepaliveInput}
    udp: true
    mtu: ${mtu}
    amnezia-wg-option:
      jc: ${jc}
      jmin: ${jmin}
      jmax: ${jmax}
      s1: ${s1}
      s2: ${s2}
      h1: ${h1}
      h2: ${h2}
      h3: ${h3}
      h4: ${h4}

proxy-groups:
  - name: "✅ Selector"
    type: select
    proxies:
      - ${name}
      - DIRECT
  - name: "Auto"
    type: url-test
    proxies:
      - ${name}
    url: https://www.gstatic.com/generate_204
    interval: 30
    tolerance: 50

rules:
  - GEOIP,lan,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve
${irRule}  - MATCH,✅ Selector

ntp:
  enable: true
  server: time.cloudflare.com
  port: 123
  interval: 30`;
      }

      // ========== XRAY JSON ==========
      else {
        const noiseBlock = useNoise ? `,
      "streamSettings": {
        "finalmask": {
          "udp": [{
            "type": "noise",
            "settings": {
              "reset": "30-60",
              "noise": [
                {"rand": "50-100", "randRange": "0-255", "delay": "1-5"},
                {"rand": "50-100", "randRange": "0-255", "delay": "1-5"},
                {"rand": "50-100", "randRange": "0-255", "delay": "1-5"},
                {"rand": "50-100", "randRange": "0-255", "delay": "1-5"},
                {"rand": "50-100", "randRange": "0-255", "delay": "1-5"}
              ]
            }
          }]
        }
      }` : '';

        const irRules = irBypass ? `
      {
        "type": "field",
        "ip": ["geoip:private", "geoip:ir"],
        "outboundTag": "direct"
      },
      {
        "type": "field",
        "domain": ["regexp:.*\\\\.ir$", "geosite:category-ir"],
        "outboundTag": "direct"
      },` : `
      {
        "type": "field",
        "ip": ["geoip:private"],
        "outboundTag": "direct"
      },`;

        result = `{
  "remarks": "${name}",
  "log": { "loglevel": "warning" },
  "dns": {
    "servers": [
      { "address": "${dnsServer}", "tag": "remote-dns" },
      "1.1.1.1"
    ],
    "queryStrategy": "UseIPv4"
  },
  "inbounds": [{
    "listen": "0.0.0.0",
    "port": 10808,
    "protocol": "mixed",
    "settings": { "auth": "noauth", "udp": true },
    "sniffing": {
      "destOverride": ["http", "tls"],
      "enabled": true,
      "routeOnly": true
    },
    "tag": "mixed-in"
  }],
  "outbounds": [
    {
      "protocol": "wireguard",
      "settings": {
        "secretKey": "${d.privateKey}",
        "address": ${JSON.stringify(addresses)},
        "mtu": ${mtu},
        "peers": [{
          "endpoint": "${d.endpoint}",
          "publicKey": "${d.publicKey}",
          ${d.presharedKey ? `"preSharedKey": "${d.presharedKey}",` : ''}
          "keepAlive": ${d.keepalive || keepaliveInput},
          "allowedIPs": ["0.0.0.0/0", "::/0"]
        }]
      }${noiseBlock},
      "tag": "proxy"
    },
    { "protocol": "freedom", "tag": "direct" },
    { "protocol": "blackhole", "tag": "block" }
  ],
  "routing": {
    "domainStrategy": "IPIfNonMatch",
    "rules": [
${irRules}
      {
        "type": "field",
        "network": "tcp,udp",
        "outboundTag": "proxy"
      }
    ]
  }
}`;
      }

      document.getElementById('result').value = result;
      status.className = 'status success';
      status.textContent = '✅ Converted successfully!';
    }

    function copyResult() {
      const el = document.getElementById('result');
      el.select();
      navigator.clipboard.writeText(el.value);
      document.getElementById('status').textContent = '📋 Copied to clipboard!';
      document.getElementById('status').className = 'status success';
    }

    function clearAll() {
      document.getElementById('wg').value = '';
      document.getElementById('manualPrivate').value = '';
      document.getElementById('manualPublic').value = '';
      document.getElementById('manualEndpoint').value = '';
      document.getElementById('manualPSK').value = '';
      document.getElementById('result').value = '';
      document.getElementById('status').textContent = '';
    }
  </script>
</body>
</html>
