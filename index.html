<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WG Converter | Amnezia + Clash + Xray</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --primary: #0ea5e9;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; color: var(--primary); margin-bottom: 6px; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    textarea, input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-family: ui-monospace, monospace;
      font-size: 13px;
    }
    textarea { min-height: 180px; resize: vertical; }
    .row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 120px; }
    .checkbox { display: flex; align-items: center; gap: 8px; margin: 12px 0; }
    .checkbox input { width: auto; }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    button:hover { background: #0284c7; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab {
      padding: 6px 14px;
      background: #334155;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .tab.active { background: var(--primary); }
    .status { margin-top: 10px; font-size: 13px; min-height: 20px; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <h1>WireGuard Converter</h1>
    <p class="subtitle">AmneziaWG + Clash Meta + Xray JSON | with IR Bypass & Noise</p>

    <div class="grid">
      <!-- Left: Input -->
      <div class="card">
        <label>Proxy Name</label>
        <input type="text" id="name" value="Proton-NL" style="margin-bottom:12px">

        <label>WireGuard Config</label>
        <textarea id="wg" placeholder="Paste your [Interface] + [Peer] here..."></textarea>

        <div class="checkbox">
          <input type="checkbox" id="irBypass" checked>
          <label for="irBypass" style="margin:0;color:var(--text)">Add IR Bypass rules (for JSON)</label>
        </div>

        <div class="checkbox">
          <input type="checkbox" id="useNoise" checked>
          <label for="useNoise" style="margin:0;color:var(--text)">Enable Noise / finalmask</label>
        </div>

        <label style="margin-top:12px">Amnezia / Noise Parameters</label>
        <div class="row">
          <div><label>Jc</label><input type="number" id="jc" value="5"></div>
          <div><label>Jmin</label><input type="number" id="jmin" value="50"></div>
          <div><label>Jmax</label><input type="number" id="jmax" value="100"></div>
        </div>
        <div class="row">
          <div><label>S1</label><input type="number" id="s1" value="0"></div>
          <div><label>S2</label><input type="number" id="s2" value="0"></div>
        </div>
        <div class="row">
          <div><label>H1</label><input type="number" id="h1" value="1"></div>
          <div><label>H2</label><input type="number" id="h2" value="2"></div>
          <div><label>H3</label><input type="number" id="h3" value="3"></div>
          <div><label>H4</label><input type="number" id="h4" value="4"></div>
        </div>

        <div class="btn-row">
          <button onclick="convert()">Convert</button>
          <button class="secondary" onclick="clearAll()">Clear</button>
        </div>
        <div id="status" class="status"></div>
      </div>

      <!-- Right: Output -->
      <div class="card">
        <div class="tabs">
          <div class="tab active" onclick="switchTab('json')">Xray JSON</div>
          <div class="tab" onclick="switchTab('clash')">Clash YAML</div>
          <div class="tab" onclick="switchTab('amnezia')">Amnezia Conf</div>
        </div>

        <label>Result (editable)</label>
        <textarea id="result" style="min-height:420px"></textarea>

        <div class="btn-row">
          <button onclick="copyResult()">Copy to Clipboard</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentTab = 'json';

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      convert(); // re-generate for the selected tab
    }

    function parseWG(text) {
      const r = { privateKey:'', address:'', dns:'', publicKey:'', endpoint:'', presharedKey:'', keepalive:25 };
      let section = '';
      for (let line of text.split('\n')) {
        line = line.trim();
        if (!line || line.startsWith('#')) continue;
        if (line.startsWith('[')) { section = line.toLowerCase(); continue; }
        const eq = line.indexOf('=');
        if (eq === -1) continue;
        const key = line.slice(0,eq).trim().toLowerCase();
        const value = line.slice(eq+1).trim();
        if (section.includes('interface')) {
          if (key === 'privatekey') r.privateKey = value;
          if (key === 'address') r.address = value;
          if (key === 'dns') r.dns = value;
        }
        if (section.includes('peer')) {
          if (key === 'publickey') r.publicKey = value;
          if (key === 'endpoint') r.endpoint = value;
          if (key === 'presharedkey') r.presharedKey = value;
          if (key === 'persistentkeepalive') r.keepalive = parseInt(value) || 25;
        }
      }
      return r;
    }

    function convert() {
      const status = document.getElementById('status');
      const input = document.getElementById('wg').value.trim();
      const name = document.getElementById('name').value.trim() || 'My-WG';
      const irBypass = document.getElementById('irBypass').checked;
      const useNoise = document.getElementById('useNoise').checked;

      if (!input) {
        status.className = 'status error';
        status.textContent = 'Please paste a WireGuard config first.';
        return;
      }

      const d = parseWG(input);
      if (!d.privateKey || !d.publicKey || !d.endpoint) {
        status.className = 'status error';
        status.textContent = 'Missing PrivateKey / PublicKey / Endpoint';
        return;
      }

      // Amnezia params
      const jc = document.getElementById('jc').value;
      const jmin = document.getElementById('jmin').value;
      const jmax = document.getElementById('jmax').value;
      const s1 = document.getElementById('s1').value;
      const s2 = document.getElementById('s2').value;
      const h1 = document.getElementById('h1').value;
      const h2 = document.getElementById('h2').value;
      const h3 = document.getElementById('h3').value;
      const h4 = document.getElementById('h4').value;

      // Address
      let addresses = d.address ? d.address.split(',').map(s => s.trim()) : ['10.2.0.2/32'];
      let ipv4 = addresses.find(a => !a.includes(':')) || '10.2.0.2/32';
      let ipv6 = addresses.find(a => a.includes(':')) || '';

      // Endpoint
      let server = d.endpoint, port = 51820;
      if (d.endpoint.includes(':')) {
        const idx = d.endpoint.lastIndexOf(':');
        server = d.endpoint.slice(0, idx);
        port = d.endpoint.slice(idx + 1);
      }

      let result = '';

      // ========== AMNEZIA CONF ==========
      if (currentTab === 'amnezia') {
        result = `[Interface]
PrivateKey = ${d.privateKey}
Address = ${d.address || '10.2.0.2/32'}
DNS = ${d.dns || '1.1.1.1'}
MTU = 1280
Jc = ${jc}
Jmin = ${jmin}
Jmax = ${jmax}
S1 = ${s1}
S2 = ${s2}
H1 = ${h1}
H2 = ${h2}
H3 = ${h3}
H4 = ${h4}

[Peer]
PublicKey = ${d.publicKey}
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = ${d.endpoint}
PersistentKeepalive = ${d.keepalive}`;
        if (d.presharedKey) result += `\nPresharedKey = ${d.presharedKey}`;
      }

      // ========== CLASH YAML ==========
      else if (currentTab === 'clash') {
        result = `mixed-port: 7890
ipv6: true
allow-lan: true
mode: rule
log-level: warning
external-controller: 127.0.0.1:9090

dns:
  enable: true
  enhanced-mode: redir-host
  nameserver:
    - ${d.dns || '1.1.1.1'}

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true

proxies:
  - name: "${name}"
    type: wireguard
    ip: ${ipv4}
    ${ipv6 ? 'ipv6: ' + ipv6 : ''}
    private-key: ${d.privateKey}
    server: ${server}
    port: ${port}
    public-key: ${d.publicKey}
    ${d.presharedKey ? 'pre-shared-key: ' + d.presharedKey : ''}
    allowed-ips: ['0.0.0.0/0', '::/0']
    persistent-keepalive: ${d.keepalive}
    udp: true
    mtu: 1280
    amnezia-wg-option:
      jc: ${jc}
      jmin: ${jmin}
      jmax: ${jmax}
      s1: ${s1}
      s2: ${s2}
      h1: ${h1}
      h2: ${h2}
      h3: ${h3}
      h4: ${h4}

proxy-groups:
  - name: "Selector"
    type: select
    proxies: ["${name}", DIRECT]

rules:
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,IR,DIRECT,no-resolve
  - MATCH,Selector`;
      }

      // ========== XRAY JSON ==========
      else {
        const noiseBlock = useNoise ? `
      "streamSettings": {
        "finalmask": {
          "udp": [
            {
              "type": "noise",
              "settings": {
                "reset": "30-60",
                "noise": [
                  {"rand": "50-100", "randRange": "0-255", "delay": "1-5"},
                  {"rand": "50-100", "randRange": "0-255", "delay": "1-5"},
                  {"rand": "50-100", "randRange": "0-255", "delay": "1-5"},
                  {"rand": "50-100", "randRange": "0-255", "delay": "1-5"},
                  {"rand": "50-100", "randRange": "0-255", "delay": "1-5"}
                ]
              }
            }
          ]
        }
      },` : '';

        const irRules = irBypass ? `
      {
        "type": "field",
        "ip": ["geoip:private", "geoip:ir"],
        "outboundTag": "direct"
      },
      {
        "type": "field",
        "domain": ["regexp:.*\\\\.ir$", "geosite:category-ir"],
        "outboundTag": "direct"
      },` : `
      {
        "type": "field",
        "ip": ["geoip:private"],
        "outboundTag": "direct"
      },`;

        result = `{
  "remarks": "${name}",
  "log": { "loglevel": "warning" },
  "dns": {
    "servers": [
      { "address": "${d.dns || '1.1.1.1'}", "tag": "remote-dns" },
      "1.1.1.1"
    ],
    "queryStrategy": "UseIPv4"
  },
  "inbounds": [
    {
      "listen": "0.0.0.0",
      "port": 10808,
      "protocol": "mixed",
      "settings": { "auth": "noauth", "udp": true },
      "sniffing": {
        "destOverride": ["http", "tls"],
        "enabled": true,
        "routeOnly": true
      },
      "tag": "mixed-in"
    }
  ],
  "outbounds": [
    {
      "protocol": "wireguard",
      "settings": {
        "secretKey": "${d.privateKey}",
        "address": ${JSON.stringify(addresses)},
        "mtu": 1280,
        "peers": [
          {
            "endpoint": "${d.endpoint}",
            "publicKey": "${d.publicKey}",
            ${d.presharedKey ? `"preSharedKey": "${d.presharedKey}",` : ''}
            "keepAlive": ${d.keepalive},
            "allowedIPs": ["0.0.0.0/0", "::/0"]
          }
        ]
      },${noiseBlock}
      "tag": "proxy"
    },
    { "protocol": "freedom", "tag": "direct" },
    { "protocol": "blackhole", "tag": "block" }
  ],
  "routing": {
    "domainStrategy": "IPIfNonMatch",
    "rules": [
${irRules}
      {
        "type": "field",
        "network": "tcp,udp",
        "outboundTag": "proxy"
      }
    ]
  }
}`;
      }

      document.getElementById('result').value = result;
      status.className = 'status success';
      status.textContent = '✅ Converted successfully!';
    }

    function copyResult() {
      const el = document.getElementById('result');
      el.select();
      navigator.clipboard.writeText(el.value);
      document.getElementById('status').textContent = '📋 Copied!';
      document.getElementById('status').className = 'status success';
    }

    function clearAll() {
      document.getElementById('wg').value = '';
      document.getElementById('result').value = '';
      document.getElementById('status').textContent = '';
    }
  </script>
</body>
</html>
